name: Auto-Post Sureq Galigo to Threads

on:
  schedule:
    # 07:00, 12:00, dan 20:00 WITA (UTC+8)
    # Konversi ke UTC:
    # 07:00 WITA = 23:00 UTC (hari sebelumnya)
    # 12:00 WITA = 04:00 UTC
    # 20:00 WITA = 12:00 UTC
    - cron: '5 23,4,12 * * *'
  workflow_dispatch:
    inputs:
      force_episode:
        description: 'Nomor episode tertentu (opsional, kosongkan untuk urutan normal)'
        required: false
        default: ''
      skip_jitter:
        description: 'Lewati penundaan human jitter 0-9 menit'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Post Bot
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_JITTER: ${{ github.event.inputs.skip_jitter || 'false' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.force_episode }}" ]; then
            ARGS="$ARGS --force-episode ${{ github.event.inputs.force_episode }}"
          fi
          python bot.py $ARGS

      - name: Commit and Push State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json episodes.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan state untuk di-commit."
          else
            git commit -m "chore: perbarui state posting episode Sureq Galigo [skip ci]"
            git push origin main
          fi
